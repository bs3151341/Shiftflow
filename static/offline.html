<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101828">
  <title>ShiftFlow unavailable</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f7fb; color: #152033; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(100%, 420px); padding: 32px; background: #fff; border: 1px solid #e5e9f0; border-radius: 18px; box-shadow: 0 18px 60px rgba(15, 23, 42, .08); text-align: center; }
    h1 { margin: 0 0 12px; }
    p { color: #59687e; line-height: 1.6; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; background: #2563eb; color: #fff; font-weight: 700; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>ShiftFlow is offline</h1>
    <p>Reconnect to the internet or local server, then try again.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
