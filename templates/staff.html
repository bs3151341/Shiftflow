{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">TEAM</p><h1>Manage staff</h1></div></div>
<div class="grid-2">
<div class="panel">
<h2>Add worker</h2>
<form method="post" action="{{ url_for('add_staff') }}">
<label>Name<input name="name" required></label>
<label>Email<input type="email" name="email" required></label>
<label>Position<input name="position" value="Crew Member"></label>
<label>Temporary password<input name="password" value="ShiftFlow123"></label>
<button class="btn">Add worker</button>
</form>
</div>
<div class="panel">
<h2>Workers</h2>
{% for w in workers %}
<div class="shift">
<div><strong>{{ w.name }}</strong><br><span class="muted">{{ w.email }} · {{ w.position }}</span></div>
<form method="post" action="{{ url_for('delete_staff', user_id=w.id) }}"><button class="btn danger small">Delete</button></form>
</div>
{% else %}<p class="muted">No workers yet.</p>{% endfor %}
</div>
</div>
{% endblock %}
